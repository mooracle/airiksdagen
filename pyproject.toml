[project]
name = "aidag"
version = "0.1.0"
description = "AI Riksdag — plan-following AI party agents vs actual Riksdag votes 2022–2026"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "typer>=0.15",
    "polars>=1.17",
    "pydantic>=2.10",
    "httpx>=0.28",
    "anthropic>=0.75",
    "pypdf>=5.1",
]

[project.scripts]
aidag = "aidag.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline/aidag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
