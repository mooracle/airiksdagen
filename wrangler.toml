# Cloudflare Workers static-assets config for airiksdagen.se.
#
# Cloudflare connected this repo as a Workers Build, so the deploy step runs
# `npx wrangler deploy` (not `wrangler pages deploy`). This deploys an
# assets-only Worker — no server code — serving the built static site.
#
# Flow: build command `bash scripts/cf_pages_build.sh` produces site/dist,
# then `npx wrangler deploy` uploads it (_headers in site/dist is honored).
name = "airiksdagen"
compatibility_date = "2026-07-15"

[assets]
directory = "./site/dist"
