# Cloudflare Workers static-assets config for airiksdagen.se.
#
# The Python pipeline is research-only and runs LOCALLY; its output
# (site/src/data/, committed) is what the site builds from. So the cloud build
# is pure Node — no uv, no Python, no data fetch. `wrangler deploy` runs the
# [build] command (Astro), then uploads site/dist as an assets-only Worker.
#
# Leave the dashboard "Build command" EMPTY so this doesn't run twice.
name = "airiksdagen"
compatibility_date = "2026-07-15"

[build]
command = "cd site && npm ci && npm run build"

[assets]
directory = "./site/dist"
