# Cloudflare Workers static-assets config for airiksdagen.se.
#
# This file lives in site/ ON PURPOSE: set the Cloudflare project's Root
# directory to `site` so the build context is Node-only. The repo root has the
# research pipeline's pyproject.toml + uv.lock; keeping Cloudflare pointed at
# site/ means it never detects or installs Python/uv. The build is pure Node.
#
# The Python pipeline is research-only and runs LOCALLY; its output
# (site/src/data/, committed) is what the site builds from — no data fetch here.
# `wrangler deploy` runs [build] (Astro), then uploads dist as an assets-only
# Worker. Leave the dashboard "Build command" EMPTY so it doesn't run twice.
name = "airiksdagen"
compatibility_date = "2026-07-15"

[build]
command = "npm ci && npm run build"

[assets]
directory = "./dist"
