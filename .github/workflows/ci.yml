name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run pytest -q
      # hermetic verify only (raw/processed are gitignored). Data-dependent
      # checks (verify votes/cases/kb) run in the Cloudflare build, which
      # rebuilds data/processed first — see scripts/cf_pages_build.sh.
      - run: uv run aidag verify prompts

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: site
      - run: npx astro check || true
        working-directory: site
      # The block renderer, the deep-link sweep over every anchor and the
      # Python↔TypeScript parity of `is_navigational` live only here — `uv run
      # pytest` cannot reach them, and the Cloudflare build runs `npm ci &&
      # npm run build` only. Needs Node ≥ 22.18 for type stripping, which
      # `node-version: 22` above resolves to.
      - run: npm test
        working-directory: site
