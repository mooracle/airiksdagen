name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run pytest -q
      # hermetic verify only (raw/processed are gitignored). Data-dependent
      # checks (verify votes/cases/kb) run in the Cloudflare build, which
      # rebuilds data/processed first — see scripts/cf_pages_build.sh.
      - run: uv run aidag verify prompts

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: site
      - run: npx astro check || true
        working-directory: site
