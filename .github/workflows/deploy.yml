name: Deploy site

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/results/**'
      - 'site/**'
      - 'pipeline/**'
      - 'wrangler.toml'
      - '.github/workflows/deploy.yml'

permissions:
  contents: read

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

env:
  # The published run; change when promoting a new simulation run.
  RUN_ID: 'full-v3'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: uv sync
      # Rebuild the gitignored processed data from public sources.
      - run: uv run aidag fetch-votes
      - run: uv run aidag fetch-cases
      - run: uv run aidag build-cases
      - run: uv run aidag verify votes && uv run aidag verify cases
      - name: Export site data
        run: |
          if [ -n "$RUN_ID" ]; then
            uv run aidag export-site --run-id "$RUN_ID"
          else
            uv run aidag export-site
          fi
      - name: Build site
        run: npm ci && npx astro build
        working-directory: site
        env:
          SITE_BASE: /
          SITE_URL: https://airiksdagen.se
      # Deploy site/dist to Cloudflare Pages. Project name + output dir come from
      # wrangler.toml; --branch=main marks this a production deployment.
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy --branch=main
