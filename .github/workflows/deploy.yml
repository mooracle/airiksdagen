name: Deploy site

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/results/**'
      - 'site/**'
      - 'pipeline/**'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  # The published run; change when promoting a new simulation run.
  RUN_ID: ''

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: uv sync
      # Rebuild the gitignored processed data from public sources.
      - run: uv run aidag fetch-votes
      - run: uv run aidag fetch-cases
      - run: uv run aidag build-cases
      - run: uv run aidag verify votes && uv run aidag verify cases
      - name: Export site data
        run: |
          if [ -n "$RUN_ID" ]; then
            uv run aidag export-site --run-id "$RUN_ID"
          else
            uv run aidag export-site
          fi
      - run: npm ci && npx astro build
        working-directory: site
        env:
          SITE_BASE: /${{ github.event.repository.name }}
          SITE_URL: https://${{ github.repository_owner }}.github.io
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
